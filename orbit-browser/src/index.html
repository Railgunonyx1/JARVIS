<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARVIS Orbit</title>
  <link rel="stylesheet" href="css/orbit.css" />
</head>
<body>
  <div class="browser">

    <!-- ── Titlebar / Tab Strip ──────────────────────────────── -->
    <header class="titlebar" id="titlebar">
      <div class="tab-strip" id="tabStrip">
        <!-- Tabs injected by JS -->
      </div>
      <button class="new-tab-btn" id="newTabBtn" title="New tab (Ctrl+T)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </header>

    <!-- ── Toolbar ───────────────────────────────────────────── -->
    <div class="toolbar">
      <button class="nav-btn" id="backBtn" title="Back" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button class="nav-btn" id="forwardBtn" title="Forward" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button class="nav-btn" id="reloadBtn" title="Reload">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8a5 5 0 019-2.5M13 8a5 5 0 01-9 2.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 2.5V5.5H9" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>

      <div class="omnibox" id="omnibox">
        <span class="omni-lock" id="omniLock">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <rect x="2.5" y="5.5" width="7" height="5" rx="1" stroke="currentColor"/>
            <path d="M4 5.5V4a2 2 0 014 0v1.5" stroke="currentColor"/>
          </svg>
        </span>
        <input type="text" id="omniInput" placeholder="Search or enter URL" spellcheck="false" />
      </div>

      <div class="toolbar-right">
        <button class="nav-btn" id="jarvisBtn" title="JARVIS sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="3" cy="3" r=".9" fill="currentColor"/>
            <circle cx="8" cy="3" r=".9" fill="currentColor"/>
            <circle cx="13" cy="3" r=".9" fill="currentColor"/>
            <circle cx="3" cy="8" r=".9" fill="currentColor"/>
            <circle cx="8" cy="8" r=".9" fill="currentColor"/>
            <circle cx="13" cy="8" r=".9" fill="currentColor"/>
            <circle cx="3" cy="13" r=".9" fill="currentColor"/>
            <circle cx="8" cy="13" r=".9" fill="currentColor"/>
            <circle cx="13" cy="13" r=".9" fill="currentColor"/>
          </svg>
        </button>
        <div class="omni-status" id="jarvisStatus">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-label" id="statusLabel">OFF</span>
        </div>
      </div>
    </div>

    <!-- ── Body ──────────────────────────────────────────────── -->
    <div class="body">
      <!-- Web content area -->
      <div class="content-area" id="contentArea">
        <webview id="webview" class="webview" partition="persist:orbit" webpreferences="contextIsolation=no" disablewebsecurity></webview>

        <!-- Internal pages (shown when on orbit:// URLs) -->
        <div class="internal-pages" id="internalPages">
          <!-- New Tab -->
          <div class="page newtab-page" id="newtabPage">
            <div class="nt-wordmark">ORBIT</div>
            <div class="nt-sub">Search or ask JARVIS</div>
            <label class="nt-search">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.2"/>
                <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.2"/>
              </svg>
              <input type="text" id="ntpSearch" placeholder="Search the web or ask JARVIS" autofocus />
            </label>
            <div class="nt-tiles">
              <button class="nt-tile" data-url="orbit://bookmarks">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M5 3h8v13l-4-2.5L5 16V3z" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                <span>Bookmarks</span>
              </button>
              <button class="nt-tile" data-url="orbit://history">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.2"/>
                  <path d="M9 5.5V9l3 2" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                <span>History</span>
              </button>
              <button class="nt-tile" data-url="orbit://downloads">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M9 3v9M5.5 8.5L9 12l3.5-3.5M4 15h10" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                <span>Downloads</span>
              </button>
              <button class="nt-tile" data-url="orbit://tasks">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/>
                  <path d="M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                <span>Tasks</span>
              </button>
            </div>
            <div class="nt-footer">Personal · JARVIS ready</div>
          </div>
        </div>
      </div>

      <!-- ── JARVIS Sidebar ──────────────────────────────────── -->
      <aside class="sidebar" id="sidebar">
        <div class="sb-head">
          <div class="sb-matrix" id="sbMatrix" data-state="idle"></div>
          <div class="sb-brand">
            <span class="sb-title">JARVIS</span>
            <span class="sb-status">
              <span class="sb-dot" id="sbDot"></span>
              <span id="sbStateLabel">OFF</span>
            </span>
          </div>
          <div class="sb-grow"></div>
          <button class="sb-icon" id="sbClose" title="Close sidebar">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </button>
        </div>

        <nav class="sb-nav" id="sbNav">
          <button class="on" data-panel="jarvis">JARVIS</button>
          <button data-panel="agents">Agents</button>
          <button data-panel="activity">Activity</button>
          <button data-panel="memory">Memory</button>
        </nav>

        <div class="sb-context" id="sbContext">
          <span class="sb-ctx-label">This page</span>
          <span class="sb-ctx-title" id="sbPageTitle">New tab</span>
          <div class="sb-ctx-actions">
            <button class="sb-chip" data-action="summarize">Summarize</button>
            <button class="sb-chip" data-action="explain">Explain</button>
            <button class="sb-chip" data-action="research">Research</button>
          </div>
        </div>

        <main class="sb-body" id="sbBody">
          <!-- Panel content injected by JS -->
        </main>

        <footer class="sb-composer">
          <div class="sb-composer-box">
            <textarea id="sbInput" rows="2" placeholder="Ask JARVIS anything…"></textarea>
            <div class="sb-composer-bar">
              <div class="sb-grow"></div>
              <button class="sb-send" id="sbSend" title="Send">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4"/>
                </svg>
              </button>
            </div>
          </div>
        </footer>
      </aside>
    </div>

    <!-- ── Floating Glyph (when sidebar closed, agent active) ── -->
    <div class="float-glyph" id="floatGlyph">
      <div class="sb-matrix" id="floatMatrix" data-state="running"></div>
      <div>
        <b id="floatTitle">Researching</b>
        <div id="floatSub">click to open</div>
      </div>
    </div>

    <!-- ── Approval Modal ────────────────────────────────────── -->
    <div class="modal-bg" id="modalBg">
      <div class="modal critical" id="approvalModal">
        <div class="modal-risk">Risk · High</div>
        <h3 id="modalTitle">JARVIS wants to take an action</h3>
        <p id="modalDesc">This action requires your approval.</p>
        <dl class="modal-kv" id="modalKv"></dl>
        <div class="modal-actions">
          <button class="btn danger" id="modalDeny">Deny</button>
          <button class="btn" id="modalAllowOnce">Allow once</button>
          <button class="btn primary" id="modalAllowSite">Always for this site</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/renderer.js"></script>
</body>
</html>
