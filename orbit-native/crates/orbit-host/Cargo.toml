[package]
name = "orbit-host"
description = "Orbit's native Windows shell: WebView2 controllers, windows, profiles, and the JARVIS RPC client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[[bin]]
name = "orbit-probe"
path = "src/bin/probe.rs"

[dependencies]
orbit-core = { path = "../orbit-core" }
serde.workspace = true
serde_json.workspace = true
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
] }