[workspace]
resolver = "2"
members = [
    "crates/orbit-core",
]

# Phase 1 (the WebView2 host) is designed in docs/ORBIT-NATIVE-MIGRATION.md but
# is NOT implemented. Adding "crates/orbit-host" back is the first line of that
# phase; until it compiles it must not sit in the workspace, or `cargo test`
# stops being a signal about the code that does work.
# crates/orbit-host = "not yet"
exclude = ["crates/orbit-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true