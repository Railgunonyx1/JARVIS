name: Dynamic Island CI

on:
  push:
    branches: [dynamic-island, dynamic-island-cleanup, dynamic-island-core]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dynamic-island-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  QT_QPA_PLATFORM: offscreen
  PYTHONPATH: dynamic-island:.

jobs:
  quality:
    name: Lint, tests and secret scan (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Safety lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Desktop and application tests
        run: |
          python -m pytest tests/ -q
          python -m pytest dynamic-island/tests/ -q
      - name: Secret scan
        run: python scripts/scan_secrets.py
