name: Bug Report
description: Create a report to help us improve JARVIS MK-X
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: environment
    attributes:
      label: Operating System & Python Version
      description: What OS (Windows 10/11, Ubuntu, macOS) and Python version are you running?
      placeholder: e.g. Windows 11, Python 3.11.9
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this issue?
      placeholder: |
        1. Run `python -m cli --mode agent`
        2. Enter command `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Traceback
      render: shell
