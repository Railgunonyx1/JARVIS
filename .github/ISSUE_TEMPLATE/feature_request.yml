name: Feature Request
description: Suggest an idea or enhancement for JARVIS MK-X
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a new idea or enhancement!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you'd like JARVIS to do.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem / Motivation
      description: What problem does this solve or why is this feature needed?
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions or features you've considered.
