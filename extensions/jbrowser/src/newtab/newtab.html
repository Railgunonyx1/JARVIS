<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <div class="nt-wrap">

      <!-- ── Wordmark ──────────────────────────────────────────── -->
      <div class="nt-center">
        <div class="nt-wordmark">ORBIT</div>
        <div class="nt-sub">Search or ask JARVIS</div>

        <!-- ── Search ────────────────────────────────────────── -->
        <label class="nt-omnibox">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.2"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.2"/></svg>
          <input type="text" id="nt-input" placeholder="Search the web or ask JARVIS" autofocus />
          <button id="nt-btn" title="Go">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </label>

        <!-- ── Status ─────────────────────────────────────────── -->
        <div class="nt-status-row">
          <span class="nt-dot" id="nt-dot"></span>
          <span class="nt-status" id="nt-status">checking…</span>
        </div>
      </div>

      <!-- ── Tiles ────────────────────────────────────────────── -->
      <div class="nt-tiles">
        <button class="nt-tile" data-go="bookmarks">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 3h8v13l-4-2.5L5 16V3z" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>Bookmarks</span>
        </button>
        <button class="nt-tile" data-go="history">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M9 5.5V9l3 2" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>History</span>
        </button>
        <button class="nt-tile" data-go="downloads">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3v9M5.5 8.5L9 12l3.5-3.5M4 15h10" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>Downloads</span>
        </button>
        <button class="nt-tile" data-go="tasks">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>Tasks</span>
        </button>
      </div>

      <!-- ── Agent actions (appear once there's something to do) ── -->
      <section class="nt-quick" id="nt-quick" hidden>
        <div class="nt-quick-title">Agent actions</div>
        <div class="nt-chips" id="nt-chips"></div>
      </section>

      <!-- ── Conversation thread ──────────────────────────────── -->
      <main id="nt-thread" class="nt-thread" aria-live="polite"></main>

      <!-- ── Footer ───────────────────────────────────────────── -->
      <footer class="nt-footer">
        <button type="button" id="nt-sidebar" class="nt-footer-link">Open JARVIS sidebar</button>
        <span class="nt-footer-sep">·</span>
        <span class="nt-footer-mono">Personal · Sync on · JARVIS ready</span>
      </footer>

      <script type="module" src="newtab.js"></script>
    </div>
  </body>
</html>
