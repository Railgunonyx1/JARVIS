<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="../lib/tokens.css" />
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <header class="jb-topbar">
      <div class="jb-brand">
        <span class="jb-logo" aria-hidden="true"></span>
        <span class="jb-title">JARVIS</span>
        <span class="jb-pill" id="jb-status-pill">
          <span class="jb-dot" id="jb-status-dot"></span>
          <span class="jb-status-label" id="jb-status-label">checking…</span>
        </span>
      </div>
      <div class="jb-actions">
        <button id="jb-clear" class="jb-icon-btn" title="Clear conversation">↺</button>
        <button id="jb-toggle-control" class="jb-icon-btn" title="Bridge connection settings">⚙</button>
      </div>
    </header>

    <section id="jb-state" class="jb-state" hidden>
      <span class="jb-state-dot" aria-hidden="true"></span>
      <span class="jb-state-text" id="jb-state-text"></span>
      <button id="jb-state-action" class="jb-link-btn" hidden></button>
    </section>

    <section id="jb-page-bar" class="jb-page-bar">
      <div class="jb-page-meta">
        <span class="jb-page-eyebrow">Current page</span>
        <span class="jb-page-title" id="jb-page-title">No page</span>
        <span class="jb-page-url" id="jb-page-url"></span>
      </div>
      <label class="jb-listen-switch" title="JARVIS can see this page">
        <span>Listening</span>
        <input type="checkbox" id="jb-listen" checked />
      </label>
    </section>

    <main id="jb-thread" class="jb-thread" aria-live="polite"></main>

    <footer class="jb-composer">
      <textarea
        id="jb-input"
        rows="1"
        placeholder="Ask JARVIS about this page…  (Ctrl+Enter to send)"
      ></textarea>
      <button id="jb-send" class="jb-send-btn" title="Send" aria-label="Send">➤</button>
    </footer>

    <section id="jb-settings" class="jb-settings" hidden>
      <div class="jb-settings-title">Bridge connection</div>
      <p class="jb-settings-note">
        Optional bearer token for the JARVIS bridge
        (<code>127.0.0.1:8170</code>). Required only when the bridge runs with
        <code>--auth</code>. Browser control always goes through JARVIS tools.
      </p>
      <label class="jb-settings-row">
        <span>Bridge token</span>
        <input type="text" id="jb-bridge-token" autocomplete="off" spellcheck="false" />
      </label>
      <div class="jb-settings-actions">
        <button id="jb-settings-save" class="jb-btn">Save</button>
        <button id="jb-settings-close" class="jb-btn ghost">Close</button>
      </div>
    </section>

    <script type="module" src="sidebar.js"></script>
  </body>
</html>
