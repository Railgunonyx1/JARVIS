[workspace]
members = [
    "crates/jarvis-core",
    "crates/jarvis-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "jarvis-dynamic-island"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
ctrlc = "3"
once_cell = "1"

[workspace.lints]
workspace = true

[lints]
workspace = true
