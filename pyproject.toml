[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLW"]
ignore = [
    "BLE001",  # Broad exception catching — intentional in Flask API handlers
    "S110",    # try-except-pass — intentional for optional subsystems
    "PLW0603", # Global statements — necessary in Flask server pattern
    "PLW0602", # Global without assignment — camera/hand_tracker lazy init
    "PLW1508", # env var default type — int conversion is safe
    "B023",    # Loop variable binding — closures in async generators are fine
    "B008",    # Lambda default — mode.lower() in loop body is safe
    "B007",    # Unused loop variable — intentional in async for
    "E402",    # Module level import not at top — needed for env setup before imports
]

[tool.ruff.lint.isort]
known-first-party = ["core", "web", "pipeline", "actions", "vision", "memory", "python"]
