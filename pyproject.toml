[project]
name = "jarvis-dynamic-island"
version = "0.2.0"
description = "KDE Plasma 6 Dynamic Island with an optional JARVIS AI assistant"
requires-python = ">=3.11"
license = { text = "Proprietary — All Rights Reserved" }

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "ui/*.tcss",
    "inference_engine",
    "knowledge_graph",
    "agents",
    "systems",
    "legacy",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLW"]
ignore = [
    "BLE001",
    "S110",
    "PLW0603",
    "PLW0602",
    "PLW1508",
    "B023",
    "B008",
    "B007",
    "E402",
    "PLW2901",
]

[tool.ruff.lint.isort]
known-first-party = [
    "app", "core", "memory", "providers", "tools", "runtime", "security",
    "jarvis_core", "jarvis_models", "jarvis_tools", "jarvis_memory",
    "jarvis_mcp", "jarvis_routing", "jarvis_verification",
]

[tool.ruff.lint.extend-per-file-ignores]
"memory/user_profile.py" = ["E501"]
"tools/__init__.py" = ["E501"]
"core/harness_selector.py" = ["E501"]
"benchmark/gate.py" = ["E501"]
"scripts/*" = ["E501", "E722", "PLW1510"]
"optimizer/run_eval.py" = ["E501"]
"tests/*" = ["PLW0108", "E702", "E501", "E731", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires physical audio, camera or desktop hardware",
    "e2e: end-to-end tests requiring live model/API access (opt-in)",
    "requires_qt: requires Qt runtime modules",
    "manual: requires manual target-system validation",
]
