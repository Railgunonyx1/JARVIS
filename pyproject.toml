[project]
name = "jarvis1"
version = "0.1.0"
description = "JARVIS MK-X — Autonomous Engineering Agent"
requires-python = ">=3.11"
license = "MIT"

[tool.uv.workspace]
members = ["packages/*", "plugins/*", "apps/*", "vendor/*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "ui/*.tcss",
    "inference_engine",
    "knowledge_graph",
    "agents",
    "systems",
    "legacy",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLW"]
ignore = [
    "BLE001",
    "S110",
    "PLW0603",
    "PLW0602",
    "PLW1508",
    "B023",
    "B008",
    "B007",
    "E402",
    "PLW2901",
]

[tool.ruff.lint.isort]
known-first-party = [
    "jarvis_core", "jarvis_models", "jarvis_tools", "jarvis_memory",
    "jarvis_mcp", "jarvis_routing", "jarvis_verification", "jarvis_ui",
    "jarvis_ollama", "jarvis_openrouter", "jarvis_gemini", "jarvis_groq",
    "core", "memory", "providers", "tools", "runtime", "cli", "security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
