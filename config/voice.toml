[stt]
primary_provider = "whisper.cpp"
fallback_provider = "elevenlabs"
model_size = "base"
binary = "whisper-cli"
model_path = "~/.jarvis/whisper/ggml-base.bin"
sample_rate = 16000
max_record_seconds = 30

[elevenlabs]
model = "scribe_v2"
api_key_env = "ELEVENLABS_API_KEY"

[tts]
primary_provider = "kokoro"
fallback_provider = "edge-tts"
voice = "af_sarah"
speed = 1.0

[kokoro]
model_dir = "~/.jarvis/kokoro"
model_file = "kokoro-v1.0.onnx"
voices_file = "voices-v1.0.bin"

[edge_tts]
# edge-tts uses its service endpoint; no API key is required.

[wake_word]
# Background wake-word listening is intentionally disabled.
enabled = false

