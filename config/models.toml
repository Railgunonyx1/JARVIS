[router]
default_provider = "groq"
# Order = race priority = execution order (_RACE_MAX_PROBES=1 probes the
# head first). Measured 2026-09-17, pinned per-provider TTFT with unique
# prompts (see PERF.md): groq 67-93ms and deepseek 54-87ms are the only
# consistently-sub-100ms providers; gemini-2.0 ~330ms; opencode_zen ~0.5-1s;
# openrouter free models 2.7-4s. Only live-key providers are listed — each
# remaining entry joins automatically the moment its key lands in
# config/.env (github_models removed: service retired 2026-07-30).
fallback_chain = [
    "groq",
    "deepseek",
    "gemini",
    "opencode_zen",
    "openrouter",
    "kilo_code",
    "agnes",
    "llm7",
    "cohere",
    "zai",
    "mistral",
    "nvidia_nim",
    "sambanova",
    "scaleway",
    "cloudflare_ai",
    "cerebras",
    "huggingface",
    "omni_route",
    "ollama",
]
max_retries = 2
timeout_seconds = 30

[groq]
# Head model: gpt-oss-120b measured 72-157ms TTFT on EVERY request including
# its first-ever (cold) one; qwen/qwen3.8-27b measured 67-93ms warm but paid
# a consistent ~2.1-2.6s on the FIRST request after every boot/idle gap
# (provider-side model cold-start, verified across 4 boots). Same reasoning
# off handling applies to both (see _REASONING_MODELS).
model = "openai/gpt-oss-120b"
max_tokens = 2048
temperature = 0.7
requests_per_minute = 60
requests_per_day = 28800
priority = 1

[groq.fallback]
# qwen3.8-27b is warm-fast (67-93ms) but cold-starts (~2.1-2.6s) after idle;
# fine as fallback where a fresh request implies a dead connection anyway.
# (Groq retired llama-3.1-8b-instant — 404 verified; gpt-oss-20b measured
# 12-13s twice — both removed.)
model = "qwen/qwen3.8-27b"
max_tokens = 2048
temperature = 0.7
requests_per_minute = 30
requests_per_day = 14400

[gemini]
model = "gemini-2.5-flash"
max_tokens = 4096
temperature = 0.7
requests_per_minute = 15
requests_per_day = 1500
priority = 2

[gemini.fallback]
model = "gemini-2.0-flash"
max_tokens = 8192
temperature = 0.7

[openrouter]
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
max_tokens = 4096
temperature = 0.7
base_url = "https://openrouter.ai/api/v1"
requests_per_minute = 20
requests_per_day = 200
priority = 3

[openrouter.fallback]
model = "nvidia/nemotron-3-super-120b-a12b:free"
max_tokens = 4096
temperature = 0.7

[opencode_zen]
model = "nemotron-3-ultra-free"
max_tokens = 4096
temperature = 0.7
base_url = "https://opencode.ai/zen/v1"
requests_per_minute = 60
requests_per_day = 500
priority = 4

[opencode_zen.fallback]
model = "deepseek-v4-flash-free"
max_tokens = 4096
temperature = 0.7

[mistral]
model = "mistral-small-latest"
max_tokens = 2048
temperature = 0.7
base_url = "https://api.mistral.ai/v1"
requests_per_minute = 30
requests_per_day = 500
priority = 4

[mistral.fallback]
model = "open-mistral-nemo"
max_tokens = 2048
temperature = 0.7

[nvidia_nim]
model = "nvidia/llama-3.3-70b-instruct"
max_tokens = 2048
temperature = 0.7
base_url = "https://integrate.api.nvidia.com/v1"
requests_per_minute = 40
requests_per_day = 1000
priority = 4

[nvidia_nim.fallback]
model = "nvidia/nemotron-4-340b-instruct"
max_tokens = 2048
temperature = 0.7

[ollama]
model = "qwen2.5:3b"
max_tokens = 1536
base_url = "http://127.0.0.1:11434"
priority = 4
# Lane-specific params are in ollama_provider.py (_LANE_PROFILES).
# Custom Modelfiles with baked-in params: models/Modelfile.qwen-*
# After running models\setup.bat, use jarrvis-interrupt/jarrvis-normal/jarrvis-heavy.

[ollama.fallback]
model = "qwen2.5:1.5b"
max_tokens = 384

[cerebras]
model = "llama-3.3-70b"
max_tokens = 4096
temperature = 0.7
requests_per_minute = 30
requests_per_day = 1000
priority = 3

[cerebras.fallback]
model = "llama-3.1-8b"
max_tokens = 4096
temperature = 0.7

[deepseek]
model = "deepseek-chat"
max_tokens = 4096
temperature = 0.7
base_url = "https://api.deepseek.com/v1"
requests_per_minute = 60
requests_per_day = 10000
priority = 2

[deepseek.fallback]
model = "deepseek-reasoner"
max_tokens = 4096
temperature = 0.7

[huggingface]
model = "meta-llama/Llama-3.3-70B-Instruct"
max_tokens = 4096
temperature = 0.7
base_url = "https://api-inference.huggingface.co/v1"
requests_per_minute = 10
requests_per_day = 500
priority = 5

# ── Free-LLM-API directory providers (freellm.net, 2026-09 data) ──────
