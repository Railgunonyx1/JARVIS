[router]
default_provider = "groq"
# Order = race priority = execution order (_RACE_MAX_PROBES=1 probes the
# head first). Measured 2026-09-17, pinned per-provider TTFT with unique
# prompts (see PERF.md): groq 67-93ms is the consistently-sub-100ms head;
# gemini-2.0 ~330ms; opencode_zen ~0.5-1s; openrouter free models 2.7-4s.
# Only live-key providers are listed — each remaining entry joins
# automatically the moment its key lands in config/.env.
#   - github_models removed: service retired 2026-07-30.
#   - deepseek is RESERVED, not live: the DEEPSEEK_API_KEY in config/.env is
#     an OpenRouter key (sk-or-v1-...), so the router's vendor-mismatch guard
#     skips it until a real key from platform.deepseek.com replaces it.
#       (Its historical 54-87ms TTFT made it the ideal racer — re-promote it
#       in the race as soon as the key is real.)
fallback_chain = [
    "groq",
    "deepseek",
    "gemini",
    "opencode_zen",
    "openrouter",
    "kilo_code",
    "agnes",
    "llm7",
    "cohere",
    "zai",
    "mistral",
    "nvidia_nim",
    "sambanova",
    "scaleway",
    "cloudflare_ai",
    "cerebras",
    "huggingface",
    "omni_route",
    "ollama",
]
max_retries = 2
timeout_seconds = 30

[groq]
# Head model: qwen/qwen3.8-27b — clean on the engine's full request path
# (tools attached): 8/8 unpinned turns served by groq at 57-76ms warm.
# NOTE: gpt-oss-120b measured 67-157ms pinned with bare prompts BUT FAILED
# the unpinned engine path (no first token; chain walked to openrouter —
# 2026-09-17, reverted). Do not promote it without testing the full engine
# request shape first. Warm cost: qwen3.8-27b pays ~2.1-2.6s on the FIRST
# request after boot/idle (provider-side model cold-start; accepted, logged
# in PERF.md).
model = "qwen/qwen3.8-27b"
max_tokens = 2048
temperature = 0.7
requests_per_minute = 60
requests_per_day = 28800
priority = 1

[groq.fallback]
# gpt-oss-20b measured 12-13s twice (provider-side queueing) — removed.
# (Groq retired llama-3.1-8b-instant — 404 verified.)
model = "openai/gpt-oss-20b"
max_tokens = 2048
temperature = 0.7
requests_per_minute = 30
requests_per_day = 14400

