max_tokens = 4096
temperature = 0.7
base_url = "http://localhost:20128/v1"
requests_per_minute = 60
requests_per_day = 1000
priority = 4

[omni_route.fallback]
model = "auto"
max_tokens = 4096
temperature = 0.7

[planner]
plan_model = "gemini-2.5-flash-lite"
replan_model = "gemini-2.5-flash"

[resource_governor]
cpu_high = 85.0
cpu_reduce = 70.0
ram_high = 85.0

[executor]
code_model = "gemini-2.5-flash"
quick_model = "gemini-2.5-flash-lite"
analyze_model = "gemini-2.5-flash-lite"
fix_model = "gemini-2.0-flash"

# inference_engine section removed — dead config, never referenced by code.
# Model routing is handled by ModelRegistry (Ollama cascade) and ProviderRouter (cloud fallback).

# ── Memory Enhancement (1B Model) ──────────────────────────────────────
# Uses a small model for query reformulation, reranking, and condensation.
# Set enable=false to disable (fallback to regex-only pipeline).
[memory]
enable_small_model = true
small_model = "qwen2.5:1.5b"  # Auto-pulled if missing
reformulate_timeout = 3.0      # Max seconds for query reformulation
rerank_timeout = 2.0           # Max seconds for reranking
condense_timeout = 3.0         # Max seconds for condensation
top_k = 3                      # Max memories to return after reranking
