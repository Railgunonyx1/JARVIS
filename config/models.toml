[router]
default_provider = "gemini"
fallback_chain = [
    "groq",
    "gemini",
    "cerebras",
    "deepseek",
    "openrouter",
    "opencode_zen",
    "mistral",
    "nvidia_nim",
    "huggingface",
    "omni_route",
    "ollama",
]
max_retries = 2
timeout_seconds = 30

[groq]
model = "qwen/qwen3.6-27b"
max_tokens = 2048
temperature = 0.7
requests_per_minute = 60
requests_per_day = 28800
priority = 1

[groq.fallback]
model = "llama-3.1-8b-instant"
max_tokens = 2048
temperature = 0.7
requests_per_minute = 30
requests_per_day = 14400

[gemini]
model = "gemini-2.5-flash"
max_tokens = 4096
temperature = 0.7
requests_per_minute = 15
requests_per_day = 1500
priority = 2

[gemini.fallback]
model = "gemini-2.0-flash"
max_tokens = 8192
temperature = 0.7

[openrouter]
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
max_tokens = 4096
temperature = 0.7
base_url = "https://openrouter.ai/api/v1"
requests_per_minute = 20
requests_per_day = 200
priority = 3

[openrouter.fallback]
model = "nvidia/nemotron-3-super-120b-a12b:free"
max_tokens = 4096
temperature = 0.7

[opencode_zen]
model = "nemotron-3-ultra-free"
max_tokens = 4096
temperature = 0.7
base_url = "https://opencode.ai/zen/v1"
requests_per_minute = 60
requests_per_day = 500
priority = 4

[opencode_zen.fallback]
model = "deepseek-v4-flash-free"
max_tokens = 4096
temperature = 0.7

[mistral]
model = "mistral-small-latest"
max_tokens = 2048
temperature = 0.7
base_url = "https://api.mistral.ai/v1"
requests_per_minute = 30
requests_per_day = 500
priority = 4

[mistral.fallback]
model = "open-mistral-nemo"
max_tokens = 2048
temperature = 0.7

[nvidia_nim]
model = "nvidia/llama-3.3-70b-instruct"
max_tokens = 2048
temperature = 0.7
base_url = "https://integrate.api.nvidia.com/v1"
requests_per_minute = 40
requests_per_day = 1000
priority = 4

[nvidia_nim.fallback]
model = "nvidia/nemotron-4-340b-instruct"
max_tokens = 2048
temperature = 0.7

[ollama]
model = "qwen2.5:3b"
max_tokens = 1536
base_url = "http://127.0.0.1:11434"
priority = 4
# Sampling params (temperature, top_k, top_p, num_ctx, mirostat) are
# lane-specific in ollama_provider.py (_LANE_PROFILES). Config overrides
# here only force a specific value across all lanes.

[ollama.fallback]
model = "qwen2.5:1.5b"
max_tokens = 384

[cerebras]
model = "llama-3.3-70b"
max_tokens = 4096
temperature = 0.7
requests_per_minute = 30
requests_per_day = 1000
priority = 3

[cerebras.fallback]
model = "llama-3.1-8b"
max_tokens = 4096
temperature = 0.7

[deepseek]
model = "deepseek-chat"
max_tokens = 4096
temperature = 0.7
base_url = "https://api.deepseek.com/v1"
requests_per_minute = 60
requests_per_day = 10000
priority = 2

[deepseek.fallback]
model = "deepseek-reasoner"
max_tokens = 4096
temperature = 0.7

[huggingface]
model = "meta-llama/Llama-3.3-70B-Instruct"
max_tokens = 4096
temperature = 0.7
base_url = "https://api-inference.huggingface.co/v1"
requests_per_minute = 10
requests_per_day = 500
priority = 5

[omni_route]
model = "auto"
max_tokens = 4096
temperature = 0.7
base_url = "http://localhost:20128/v1"
requests_per_minute = 60
requests_per_day = 1000
priority = 4

[omni_route.fallback]
model = "auto"
max_tokens = 4096
temperature = 0.7

[planner]
plan_model = "gemini-2.5-flash-lite"
replan_model = "gemini-2.5-flash"

[executor]
code_model = "gemini-2.5-flash"
quick_model = "gemini-2.5-flash-lite"
analyze_model = "gemini-2.5-flash-lite"
fix_model = "gemini-2.0-flash"

# inference_engine section removed — dead config, never referenced by code.
# Model routing is handled by ModelRegistry (Ollama cascade) and ProviderRouter (cloud fallback).
