# JARVIS MK-X — DeepSeek Harness Profile
# Boots the DSH base bundle and exposes JARVIS's real Python tool catalog
# via an MCP client bridge.
#
# The DSH base bundle already ships the full tool set (shell, fs, skill,
# plan-mode, compaction, todo, subagents) and its own persona. This patch:
#   1. picks the default model (overrides the base entry by id)
#   2. INSERTs the JARVIS Python tool bridge (dsh-mcp-client)
#
# Install (setup.sh): copy this file to
#   %USERPROFILE%/.dsh/profiles/jarvis/cordis.patch.yml
# then boot:  dsh --profile jarvis

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: ollama_local
    model: qwen2.5:3b

- insert:
    - id: jarvis-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: jarvis
        transport: stdio
        command: C:\Users\aayan\Desktop\JARVIS\venv\Scripts\python.exe
        args:
          - C:\Users\aayan\Desktop\JARVIS\plugins\jarvis-mcp-server\jarvis_mcp_server.py
        cwd: C:\Users\aayan\Desktop\JARVIS
        toolCallTimeoutMs: 60000
